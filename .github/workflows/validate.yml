name: Validate Claude plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate plugin and marketplace
        run: claude plugin validate --strict .

      - name: Check release consistency
        run: python3 scripts/check_release.py

      - name: Check adaptive usage contract
        run: python3 scripts/check_usage_modes.py

      - name: Check progressive-disclosure prompt budgets
        run: |
          python3 scripts/sync_department_contract.py
          python3 scripts/check_prompt_budgets.py

      - name: Check runtime evaluation cases
        run: python3 scripts/evaluate_results.py

      - name: Check standalone packages are current
        run: |
          python3 scripts/build_standalone.py
          git diff --exit-code -- packages/standalone
